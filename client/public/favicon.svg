<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a86"/>
      <stop offset="0.55" stop-color="#242c52"/>
      <stop offset="1" stop-color="#151a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#4ad6c4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4ad6c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecf5"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#glow)"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="14.3" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- die -->
  <g transform="rotate(-12 32 32)">
    <rect x="14" y="14" width="36" height="36" rx="9" fill="#0b1024" opacity="0.35" transform="translate(1.5 2.5)"/>
    <rect x="14" y="14" width="36" height="36" rx="9" fill="url(#die)"/>
    <rect x="15" y="15" width="34" height="34" rx="8" fill="none" stroke="#c3ccdd" stroke-opacity="0.6" stroke-width="1"/>
    <!-- pips (quincunx): 4 navy corners + gold center -->
    <circle cx="23" cy="23" r="4" fill="#26305a"/>
    <circle cx="41" cy="23" r="4" fill="#26305a"/>
    <circle cx="23" cy="41" r="4" fill="#26305a"/>
    <circle cx="41" cy="41" r="4" fill="#26305a"/>
    <circle cx="32" cy="32" r="4.4" fill="#ffce5a"/>
  </g>
</svg>
