<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a86"/>
      <stop offset="0.55" stop-color="#242c52"/>
      <stop offset="1" stop-color="#151a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#4ad6c4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4ad6c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7edf7"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d3e6"/>
      <stop offset="1" stop-color="#aab6d0"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aab5cd"/>
      <stop offset="1" stop-color="#8c98b5"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#glow)"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="14.3" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="55" rx="17" ry="3.2" fill="#0a0e20" opacity="0.35"/>

  <!-- ===== 3D die (isometric cube) ===== -->
  <!-- right face -->
  <polygon points="32,35 55,22 55,39 32,52" fill="url(#rightFace)"/>
  <!-- left face -->
  <polygon points="9,22 32,35 32,52 9,39" fill="url(#leftFace)"/>
  <!-- top face -->
  <polygon points="32,9 55,22 32,35 9,22" fill="url(#topFace)"/>
  <!-- edge highlights -->
  <polyline points="9,22 32,9 55,22" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1" stroke-linejoin="round"/>
  <polyline points="9,22 32,35 55,22" fill="none" stroke="#2a3560" stroke-opacity="0.25" stroke-width="1" stroke-linejoin="round"/>
  <line x1="32" y1="35" x2="32" y2="52" stroke="#2a3560" stroke-opacity="0.22" stroke-width="1"/>

  <!-- pips: top = gold center (brand), left = 3, right = 2 -->
  <ellipse cx="32" cy="22" rx="4.2" ry="2.5" fill="#ffce5a"/>
  <ellipse cx="15.5" cy="29.5" rx="2.1" ry="2.7" fill="#26305a"/>
  <ellipse cx="20.5" cy="36.5" rx="2.1" ry="2.7" fill="#26305a"/>
  <ellipse cx="25.5" cy="43.5" rx="2.1" ry="2.7" fill="#26305a"/>
  <ellipse cx="39" cy="33.5" rx="2.1" ry="2.7" fill="#1f2846"/>
  <ellipse cx="48" cy="41.5" rx="2.1" ry="2.7" fill="#1f2846"/>
</svg>
